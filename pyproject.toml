[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "robo-residual"
version = "0.1.0"
description = "Residual policy toolbox for robot control — the LoRA of policy training"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
